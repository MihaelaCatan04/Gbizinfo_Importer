spring.application.name=importer
node.id=Mihaela's Server

spring.datasource.url=jdbc:postgresql://localhost:5432/importer_db
spring.datasource.username=${username}
spring.datasource.password=${password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.liquibase.enabled=false

mybatis.configuration.map-underscore-to-camel-case=true
mybatis.mapper-locations=classpath*:mapper/**/*.xml

apiToken=${API_TOKEN}

app.security.username=${API_USERNAME:admin}
app.security.password=${API_PASSWORD:admin123}

#local-path=src/main/resources/Hojinjoho_20260302
#local-path=src/main/resources/full
local-path=src/main/resources/temporary

app.importer.url=https://info.gbiz.go.jp/hojin/Download
warehouse.base-url=http://localhost:8081

jobs.import.delay=60000
jobs.export.not-before=00:00:00
jobs.orchestrator.delay=6000

data.source=REMOTE

pipeline.import.lease.seconds=120
pipeline.export.lease.seconds=120

exporter.batch.size=50
exporter.thread.count=4
exporter.max-attempts=3

importer.max-attempts=3